<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>시스템 접근 권한 승인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #050510, #1a1a2e);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Noto Sans KR', sans-serif; color: white;
        }
        .login-card {
            background: rgba(20, 20, 30, 0.8); border: 1px solid rgba(0, 210, 255, 0.3);
            backdrop-filter: blur(10px); padding: 50px; border-radius: 20px;
            width: 100%; max-width: 450px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.15);
        }
        .title {
            font-size: 2rem; font-weight: 900; margin-bottom: 30px;
            background: linear-gradient(to right, #00d2ff, #ffffff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .form-control {
            background: rgba(0,0,0,0.5); border: 1px solid #333; color: white;
            padding: 15px; margin-bottom: 20px; border-radius: 10px;
        }
        .form-control:focus {
            background: rgba(0,0,0,0.7); border-color: #00d2ff; outline: none; color: white;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }
        .btn-login {
            width: 100%; padding: 15px; font-weight: bold;
            background: linear-gradient(90deg, #00d2ff, #007bff); border: none;
            border-radius: 50px; color: white; transition: 0.3s;
        }
        .btn-login:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="title">SECURITY ACCESS</div>
        <form th:action="@{/login}" method="post">
            <input type="text" name="username" class="form-control" placeholder="ACCESS ID" required autofocus>
            <input type="password" name="password" class="form-control" placeholder="PASSWORD" required>
            <button type="submit" class="btn-login">LOGIN</button>
            <div th:if="${param.error}" class="mt-3 text-danger fw-bold">⚠️ 접근 승인 거부</div>
        </form>
        <a href="/" class="d-block mt-4 text-secondary text-decoration-none">← 메인으로 돌아가기</a>
    </div>
</body>
</html>

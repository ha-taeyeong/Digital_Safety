<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER DEFENSE: PHISHING BLOCKER</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; color: white; font-family: 'Noto Sans KR', sans-serif; }
        #game-area { position: relative; width: 100vw; height: 100vh; background: linear-gradient(rgba(18, 16, 16, 0.9), rgba(0, 0, 0, 0.95)), repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0, 255, 255, 0.1) 1px, transparent 2px), repeating-linear-gradient(90deg, transparent, transparent 1px, rgba(0, 255, 255, 0.1) 1px, transparent 2px); background-size: 100% 100%, 40px 40px, 40px 40px; }
        
        /* UI Elements */
        .ui-panel { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; z-index: 10; width: 80%; max-width: 600px; justify-content: space-between; }
        .hud-box { background: rgba(10, 20, 40, 0.7); border: 1px solid rgba(0, 210, 255, 0.3); backdrop-filter: blur(5px); padding: 10px 25px; border-radius: 8px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center; min-width: 150px; }
        .hud-label { font-size: 0.8rem; color: #00d2ff; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; }
        .hud-value { font-size: 1.8rem; font-weight: 900; color: white; font-family: 'Orbitron', sans-serif; }
        
        /* Game Objects */
        .word { position: absolute; color: #ffcccc; background: rgba(50, 0, 0, 0.85); padding: 8px 16px; border: 1px solid #ff4d4d; font-weight: 700; font-size: 1.1rem; box-shadow: 0 0 10px rgba(255, 0, 0, 0.4); white-space: nowrap; clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%); }
        
        /* Input Area */
        .input-area { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 600px; text-align: center; z-index: 20; }
        #word-input { width: 100%; padding: 20px; font-size: 1.5rem; border: 2px solid #00d2ff; background: rgba(0, 0, 0, 0.8); color: #00d2ff; text-align: center; outline: none; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2); font-family: 'Orbitron', sans-serif; letter-spacing: 2px; border-radius: 4px; }
        
        /* Modal Common */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-box { background: rgba(20, 20, 30, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 0 50px rgba(0, 210, 255, 0.2); max-width: 500px; width: 90%; position: relative; overflow: hidden; }
        .modal-title { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; margin-bottom: 20px; color: #00d2ff; text-transform: uppercase; position: relative; }
        
        /* Buttons */
        .start-btn { padding: 12px 40px; font-size: 1.1rem; font-weight: 900; background: linear-gradient(90deg, #00d2ff, #005bea); color: #000; border: none; border-radius: 50px; cursor: pointer; text-decoration: none; margin-top: 10px; display: inline-block; transition: transform 0.2s; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
        .start-btn:hover { transform: scale(1.05); background: linear-gradient(90deg, #005bea, #00d2ff); box-shadow: 0 0 25px rgba(0, 210, 255, 0.6); }
        .home-link { position: absolute; top: 30px; left: 30px; color: rgba(255, 255, 255, 0.5); text-decoration: none; font-weight: bold; z-index: 50; border: 1px solid rgba(255, 255, 255, 0.2); padding: 8px 20px; border-radius: 30px; }
        
        /* Effects */
        .particle { position: absolute; width: 4px; height: 4px; background: #00d2ff; animation: pop 0.6s ease-out forwards; }
        @keyframes pop { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
        .red-alert { animation: redFlash 0.5s; }
        @keyframes redFlash { 0% { box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0); } 50% { box-shadow: inset 0 0 100px 50px rgba(255, 0, 0, 0.3); } 100% { box-shadow: inset 0 0 0 0 rgba(255, 0, 0, 0); } }

        /* 랭킹 리스트 스타일 */
        .rank-list { list-style: none; padding: 0; margin: 20px 0; text-align: left; max-height: 200px; overflow-y: auto; }
        .rank-item { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: 'Orbitron', sans-serif; font-size: 0.9rem; color: #ccc; transition: 0.3s; }
        .rank-item:first-child { color: #ffd700; font-weight: bold; border-color: #ffd700; background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent); } /* 1등 금색 */
        .rank-rank { width: 30px; }
        .rank-score { color: white; }
        .rank-date { font-size: 0.75rem; color: #666; margin-left: auto; margin-right: 10px; align-self: center; }

        /* 신기록 뱃지 */
        .new-record-badge { display: none; background: #ffd700; color: #000; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; animation: bounce 1s infinite; box-shadow: 0 0 15px #ffd700; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        /* 텍스트 글리치 효과 */
        .glitch { position: relative; color: #ffd700; font-weight: 900; }
        .glitch::before, .glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #14141e; }
        .glitch::before { left: 2px; text-shadow: -1px 0 #00ffff; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -1px 0 #ff00ff; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(32px, 9999px, 2px, 0); } 100% { clip: rect(82px, 9999px, 88px, 0); } }
        @keyframes glitch-anim2 { 0% { clip: rect(65px, 9999px, 100px, 0); } 100% { clip: rect(12px, 9999px, 6px, 0); } }

        /* 불꽃놀이 파티클 */
        .firework-particle { position: absolute; border-radius: 50%; animation: explode 1s ease-out forwards; pointer-events: none; z-index: 999; }
        @keyframes explode { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

    <a href="/" class="home-link">← EXIT TERMINAL</a>

    <div id="game-area">
        <div class="ui-panel">
            <div class="hud-box">
                <span class="hud-label">DEFENSE SCORE</span>
                <span id="score" class="hud-value">0</span>
            </div>
            <div class="hud-box">
                <span class="hud-label">SYSTEM INTEGRITY</span>
                <span class="hud-value"><span id="life">100</span>%</span>
            </div>
        </div>

        <div id="words-container"></div>

        <div class="input-area">
            <input type="text" id="word-input" placeholder=">> ENTER COMMAND..." autocomplete="off">
        </div>

        <div id="start-screen" class="modal-overlay">
            <div class="modal-box">
                <div class="modal-title">CYBER DEFENSE</div>
                <p style="color: #ccc; margin-bottom: 30px;">
                    피싱 키워드를 입력하여 시스템을 방어하세요.<br>
                    단어가 바닥에 닿으면 시스템이 손상됩니다.
                </p>
                <button class="start-btn" onclick="startGame()">INITIALIZE</button>
            </div>
        </div>

        <div id="game-over-screen" class="modal-overlay" style="display: none;">
            <div class="modal-box" id="result-modal">
                <div class="new-record-badge" id="new-record-badge">🏆 NEW HIGH SCORE!</div>
                <div class="modal-title" id="game-over-title">SYSTEM HALTED</div>
                
                <p style="color: #ccc; margin-bottom: 5px;">FINAL SCORE</p>
                <div style="font-size: 3rem; font-weight: 900; color: white; margin-bottom: 20px; font-family: 'Orbitron'; text-shadow: 0 0 20px rgba(255,255,255,0.3);" id="final-score">0</div>

				<div id="input-section" style="margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
				    <input type="text" id="player-name" placeholder="ENTER INITIALS (3-10)" maxlength="10" 
				           style="padding: 10px; text-align: center; font-family: 'Orbitron'; font-size: 1.2rem; width: 80%; max-width: 300px; background: rgba(0,0,0,0.5); border: 1px solid #00d2ff; color: white; border-radius:5px;">
				    
				    <div style="display: flex; gap: 10px;">
				        <button class="start-btn" onclick="saveAndShowRanking()" style="padding: 10px 30px; font-size: 1rem;">SAVE DATA</button>
				        
				        <button class="start-btn" onclick="location.reload()" 
				                style="padding: 10px 30px; font-size: 1rem; background: transparent; border: 1px solid #555; color: #888; box-shadow: none;">
				            SKIP
				        </button>
				    </div>
				</div>

                <div id="ranking-section" style="display: none;">
                    <div style="text-align: left; margin-bottom: 5px; font-size: 0.8rem; color: #00d2ff; font-family: 'Orbitron'; letter-spacing: 2px;">TOP 5 AGENTS</div>
                    <ul id="rank-list" class="rank-list"></ul>
                    <button class="start-btn" onclick="location.reload()">REBOOT SYSTEM</button>
                    <a href="/" class="start-btn" style="background: transparent; border: 1px solid #555; color: #aaa; margin-left: 10px;">EXIT</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let keywords = ["보이스피싱", "대출권유", "계좌이체", "인증번호", "검찰사칭", "자녀납치", "저금리대출", "불법도박", "주식리딩방", "원격제어", "악성앱", "개인정보", "피싱사이트", "대포통장", "현금수거책"];
        let score = 0;
        let life = 100;
        let isPlaying = false;
        let dropInterval = 1200; 
        let gameLoop;
        let wordElements = [];

        const inputEl = document.getElementById('word-input');
        const container = document.getElementById('words-container');
        const scoreEl = document.getElementById('score');
        const lifeEl = document.getElementById('life');
        const gameArea = document.getElementById('game-area');

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            inputEl.focus();
            isPlaying = true;
            score = 0;
            life = 100;
            updateUI();
            
            dropInterval = 1200;
            gameLoop = setInterval(createWord, dropInterval);
            
            setInterval(() => {
                if (isPlaying && dropInterval > 400) {
                    clearInterval(gameLoop);
                    dropInterval -= 50;
                    gameLoop = setInterval(createWord, dropInterval);
                }
            }, 5000);
        }

        function createWord() {
            if (!isPlaying) return;
            const wordText = keywords[Math.floor(Math.random() * keywords.length)];
            const el = document.createElement('div');
            el.classList.add('word');
            el.innerText = wordText;
            el.style.left = `${Math.random() * (window.innerWidth - 200) + 50}px`;
            el.style.top = `-60px`;
            container.appendChild(el);
            
            const speed = Math.random() * 2 + 2; 
            const wordObj = { el, speed, text: wordText };
            wordElements.push(wordObj);

            function drop() {
                if (!isPlaying || !wordElements.includes(wordObj)) return;
                const currentTop = parseFloat(el.style.top);
                if (currentTop > window.innerHeight - 150) {
                    damageLife();
                    removeWord(wordObj);
                } else {
                    el.style.top = `${currentTop + speed}px`;
                    requestAnimationFrame(drop);
                }
            }
            requestAnimationFrame(drop);
        }

        inputEl.addEventListener('input', (e) => {
            const value = e.target.value.trim();
            const matchIndex = wordElements.findIndex(w => w.text === value);

            if (matchIndex !== -1) {
                const matchedWord = wordElements[matchIndex];
                createExplosion(matchedWord.el); 
                removeWord(matchedWord);
                score += 100;
                inputEl.value = '';
                updateUI();
            }
        });
        
        inputEl.addEventListener('keydown', (e) => {
            if(e.key === 'Enter') inputEl.value = '';
        });

        function removeWord(wordObj) {
            if (container.contains(wordObj.el)) {
                container.removeChild(wordObj.el);
            }
            wordElements = wordElements.filter(w => w !== wordObj);
        }

        function damageLife() {
            life -= 10;
            updateUI();
            gameArea.classList.remove('red-alert');
            void gameArea.offsetWidth;
            gameArea.classList.add('red-alert');
            if (life <= 0) gameOver();
        }

        function updateUI() {
            scoreEl.innerText = score.toLocaleString();
            lifeEl.innerText = life;
            lifeEl.parentElement.style.color = life <= 30 ? '#ff4d4d' : 'white';
        }

        function gameOver() {
            isPlaying = false;
            clearInterval(gameLoop);
            container.innerHTML = '';
            wordElements = [];
            
            document.getElementById('game-over-screen').style.display = 'flex';
            
            // 점수 카운팅 효과 (0부터 올라감)
            animateScore(document.getElementById('final-score'), score);
            
            // 바로 닉네임 입력에 포커스
            document.getElementById('player-name').focus();
        }

        function animateScore(element, target) {
            let current = 0;
            const increment = Math.ceil(target / 50); 
            
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                element.innerText = current.toLocaleString();
            }, 20);
        }

        // [핵심] 저장 및 랭킹 조회 로직
        async function saveAndShowRanking() {
            const nameInput = document.getElementById('player-name');
            let nickname = nameInput.value.trim().toUpperCase();

            if (!nickname) nickname = "UNKNOWN";

            // UI 전환 (입력창 숨기고 랭킹 보여주기)
            document.getElementById('input-section').style.display = 'none';
            document.getElementById('ranking-section').style.display = 'block';

            const titleEl = document.getElementById('game-over-title');
            const badgeEl = document.getElementById('new-record-badge');
            const modalBox = document.querySelector('#result-modal');
            const rankListEl = document.getElementById('rank-list');

            try {
                // 1. 서버에 점수 저장
                await fetch('/api/game/score', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname: nickname, score: score })
                });

                // 2. 랭킹 데이터 가져오기
                const response = await fetch('/api/game/ranking');
                const rankings = await response.json();

                // 3. 신기록 여부 판단 (1등 점수와 내 점수 비교)
                const topScore = rankings.length > 0 ? rankings[0].score : 0;
                const isNewRecord = (score > 0 && score >= topScore);

                if (isNewRecord) {
                    badgeEl.style.display = 'block';
                    titleEl.innerText = "MISSION COMPLETED";
                    titleEl.setAttribute('data-text', "MISSION COMPLETED");
                    titleEl.classList.add('glitch');
                    titleEl.style.color = "#ffd700";
                    modalBox.style.borderColor = "#ffd700";
                    launchFireworks(15); // 화려한 폭죽
                } else {
                    badgeEl.style.display = 'none';
                    titleEl.innerText = "SYSTEM HALTED";
                    titleEl.classList.remove('glitch');
                    titleEl.style.color = "#ff4d4d";
                    modalBox.style.borderColor = "#ff4d4d";
                    if(score > 0) launchFireworks(3); // 소소한 폭죽
                }

                // 4. 랭킹 리스트 그리기
                rankListEl.innerHTML = '';
                rankings.forEach((rank, index) => {
                    const li = document.createElement('li');
                    li.classList.add('rank-item');
                    
                    // 내 기록 강조 (점수와 닉네임이 일치하는 가장 첫 번째 항목)
                    if (rank.score === score && rank.nickname === nickname) {
                        li.style.border = "1px solid #00d2ff";
                        li.style.backgroundColor = "rgba(0, 210, 255, 0.1)";
                    }

                    // 날짜 포맷팅 (월.일 시:분)
                    const dateObj = new Date(rank.playedAt);
                    const dateStr = `${dateObj.getMonth()+1}.${dateObj.getDate()} ${dateObj.getHours()}:${String(dateObj.getMinutes()).padStart(2,'0')}`;

                    li.innerHTML = `
                        <span class="rank-rank">#${index + 1}</span>
                        <span class="rank-date" style="color: #00d2ff; font-weight:bold; margin-right:15px;">${rank.nickname}</span>
                        <span class="rank-score">${rank.score.toLocaleString()}</span>
                    `;
                    rankListEl.appendChild(li);
                });

            } catch (error) {
                console.error("Ranking Error:", error);
                rankListEl.innerHTML = '<li style="color:red; text-align:center;">SERVER DISCONNECTED</li>';
            }
        }

        function launchFireworks(count) {
            let i = 0;
            const interval = setInterval(() => {
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                createFireworkExplosion(x, y);
                i++;
                if (i >= count) clearInterval(interval);
            }, 300);
        }

        function createFireworkExplosion(centerX, centerY) {
            const colors = ['#ff00cc', '#00d2ff', '#ffd700', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < 30; i++) { 
                const particle = document.createElement('div');
                particle.classList.add('firework-particle');
                document.body.appendChild(particle);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 200 + 50; 
                const x = Math.cos(angle) * velocity + 'px';
                const y = Math.sin(angle) * velocity + 'px';
                
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.backgroundColor = color;
                particle.style.width = (Math.random() * 6 + 2) + 'px'; 
                particle.style.height = particle.style.width;
                
                particle.style.setProperty('--x', x);
                particle.style.setProperty('--y', y);
                
                setTimeout(() => particle.remove(), 1000);
            }
        }

        function createExplosion(el) {
            const rect = el.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                document.body.appendChild(particle);
                const x = (Math.random() - 0.5) * 150 + 'px';
                const y = (Math.random() - 0.5) * 150 + 'px';
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.setProperty('--x', x);
                particle.style.setProperty('--y', y);
                particle.style.background = Math.random() > 0.5 ? '#00d2ff' : '#ff00cc';
                setTimeout(() => particle.remove(), 600);
            }
        }
    </script>
</body>
</html>

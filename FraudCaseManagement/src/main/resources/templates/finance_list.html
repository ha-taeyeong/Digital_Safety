<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>금융기관 사칭 주의 - 보안 경보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* [전체 배경] Deep Space Gradient */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* [네비게이션] */
        .nav-bar { max-width: 900px; margin: 0 auto 30px auto; }
        .home-btn {
            display: inline-flex; align-items: center; gap: 8px;
            text-decoration: none; color: rgba(255, 255, 255, 0.7);
            font-weight: 600; padding: 8px 16px; border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px; transition: 0.3s;
        }
        .home-btn:hover { background-color: rgba(255, 255, 255, 0.1); color: #fff; border-color: #fff; }

        /* [헤더 영역] */
        header { text-align: center; margin-bottom: 50px; max-width: 900px; margin-left: auto; margin-right: auto; }
        h1 {
            background: linear-gradient(to right, #ffd700, #fdb931); /* Gold Gradient */
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-size: 2.5rem; font-weight: 900; margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        /* [경고 배너 - System Alert Style] */
        .warning-banner {
            background: rgba(50, 0, 0, 0.6); border: 1px solid #ff4d4d; border-radius: 16px;
            padding: 24px; color: #ffcccc; line-height: 1.6;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.2); position: relative; overflow: hidden;
        }
        /* 스캔 라인 효과 */
        .warning-banner::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 0, 0, 0.1) 4px);
            pointer-events: none;
        }
        .warning-highlight { color: #ff4d4d; font-weight: bold; text-shadow: 0 0 5px rgba(255, 77, 77, 0.5); }

        /* [섹션 타이틀 및 버튼] */
        .section-title {
            max-width: 900px; margin: 0 auto 20px auto; display: flex;
            justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;
        }
        .section-text { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .write-btn {
            background: linear-gradient(90deg, #d946ef, #8b5cf6); /* Neon Purple */
            color: white; border: none; padding: 10px 24px; border-radius: 50px;
            cursor: pointer; font-weight: bold; box-shadow: 0 0 15px rgba(217, 70, 239, 0.3);
            transition: 0.3s;
        }
        .write-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(217, 70, 239, 0.5); }

        /* [리스트 카드 - Glassmorphism] */
        .board-container { max-width: 900px; margin: 0 auto; }
        .case-list { display: flex; flex-direction: column; gap: 15px; }
        
        .case-card {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px;
            padding: 24px; transition: all 0.3s ease; position: relative;
        }
        .case-card:hover {
            transform: translateY(-3px); background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.5); /* Gold border on hover */
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .case-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        
        .case-org {
            background: rgba(255, 215, 0, 0.1); color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3); padding: 4px 12px; border-radius: 20px;
            font-size: 0.85rem; font-weight: bold; box-shadow: 0 0 8px rgba(255, 215, 0, 0.1);
        }
        
        .case-date { font-size: 0.85rem; color: rgba(255,255,255,0.4); }
        
        .case-title {
            font-weight: bold; font-size: 1.2rem; margin-bottom: 10px;
            text-decoration: none; display: block; color: #ffffff; transition: color 0.2s;
        }
        .case-title:hover { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        
        .case-content { font-size: 0.95rem; color: #cbd5e1; line-height: 1.6; white-space: pre-wrap; }

		.meta-info-list {
			margin-top: 5px; 
		    font-size: 0.85rem;
		    color: #ccc;
		    display: flex;
		    gap: 15px;
		    justify-content: flex-end;
        }
        .meta-info-list span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.6);
        }
        .meta-info-list .views { color: #00d2ff; }
        .meta-info-list .likes { color: #ff4d4d; }
		
        /* [액션 버튼] */
		.case-actions {
		    margin-top: 10px; 
		    display: flex; 
		    gap: 10px; 
		}
        .action-btn {
            font-size: 0.8rem; padding: 6px 14px;
            border: 1px solid rgba(255,255,255,0.2); background: transparent;
            border-radius: 20px; cursor: pointer; color: rgba(255,255,255,0.6);
            text-decoration: none; transition: 0.3s;
        }
        .action-btn:hover { background: rgba(255,255,255,0.1); color: white; border-color: white; }

        /* [페이지네이션 커스텀] */
        .pagination .page-link {
            background-color: transparent; border-color: rgba(255, 255, 255, 0.1); color: #ccc;
        }
        .pagination .page-link:hover {
            background-color: rgba(255, 255, 255, 0.1); color: white;
        }
        .pagination .page-item.active .page-link {
            background-color: #6f42c1; border-color: #6f42c1; color: white;
            box-shadow: 0 0 10px rgba(111, 66, 193, 0.5);
        }
        .pagination .page-item.disabled .page-link {
            background-color: transparent; border-color: rgba(255, 255, 255, 0.05); color: #555;
        }

        /* [모달 - Glassmorphism Form] */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }
        
        .modal-box {
            background: rgba(30, 30, 50, 0.9); border: 1px solid rgba(255,255,255,0.2);
            width: 90%; max-width: 500px; border-radius: 24px; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.6); animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .modal-header {
            padding: 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,0.2);
        }
        .modal-title { font-size: 1.3rem; font-weight: 800; color: white; }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: rgba(255,255,255,0.5); border: none; background: none; transition: 0.3s; }
        .close-btn:hover { color: white; transform: rotate(90deg); }

        .form-section { padding: 30px; }
        .form-label { display: block; font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; color: #e2e8f0; }
        
        /* 모달 입력창 스타일 */
        .form-input, .form-textarea, .form-select {
            width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px;
            color: white; font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none; border-color: #d946ef;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.3); background: rgba(0, 0, 0, 0.5);
        }
        .form-select option { background-color: #24243e; color: white; }
        .form-textarea { height: 120px; resize: vertical; }
        
        .submit-btn {
            width: 100%; background: linear-gradient(90deg, #ffd700, #ffb900);
            color: #000; border: none; padding: 14px; border-radius: 50px;
            font-weight: 900; font-size: 1rem; cursor: pointer; margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); transition: 0.3s;
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(255, 215, 0, 0.6); }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="/" class="home-btn">← 메인으로</a>
    </nav>

    <header>
        <h1>금융기관 사칭</h1>
        <div class="warning-banner">
            <span style="font-weight: 800; display:block; margin-bottom:10px; font-size: 1.2rem; color: #ff4d4d;">
                🚨 대출 권유 주의
            </span>
            은행은 문자로 <span class="warning-highlight">'정부지원 저금리 대출'</span> 신청을 받지 않습니다.<br>
            <span class="warning-highlight">신분증 사진</span>이나 <span class="warning-highlight">선입금</span>을 요구하면 100% 보이스피싱입니다.
        </div>
    </header>

    <div class="section-title">
        <span class="section-text">📢 피해 사례</span>
        <button class="write-btn" onclick="openWriteModal()">새 사례 등록</button>
    </div>

    <div class="board-container">
        <div th:if="${cases.isEmpty()}" style="text-align:center; padding:60px; color:rgba(255,255,255,0.4);">
            <div style="font-size: 3rem; margin-bottom: 10px;">🛡️</div>
            <div>현재 등록된 위협 사례가 없습니다.<br>시스템이 안전합니다.</div>
        </div>

        <div th:unless="${cases.isEmpty()}">
            <div class="case-list">
                <div th:each="item : ${cases}" class="case-card">
                    <div class="case-header">
                        <span class="case-org" th:text="${item.orgName + ' 사칭'}">은행명 사칭</span>
                        <span class="case-date" th:text="${#temporals.format(item.createdDate, 'yyyy.MM.dd')}">날짜</span>
                    </div>
                    <a th:href="@{/cases/{id}(id=${item.id})}" class="case-title" th:text="${item.title}">제목</a>
                    <div class="case-content" th:text="${item.description}">내용</div>
                    <br>
					<div class="meta-info-list">
					    <span class="views">👁️ <span th:text="${item.viewCount}">0</span></span>
					    <span class="likes">❤️ <span th:text="${item.likeCount}">0</span></span>
					</div>
                    <div class="case-actions">
                        <a href="javascript:void(0)" 
                           th:onclick="|requestEdit(${item.id})|" 
                           class="action-btn">수정</a>

                        <a href="javascript:void(0)" 
                           th:onclick="|requestDelete(${item.id})|" 
                           class="action-btn">삭제</a>
                    </div>
                </div>
            </div>

            <nav aria-label="Page navigation" style="margin-top: 40px;">
                <ul class="pagination justify-content-center">
                    
                    <li class="page-item" th:classappend="${cases.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/cases/finance(page=${cases.number - 1})}" aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <li class="page-item" 
                        th:each="page: ${#numbers.sequence(0, cases.totalPages - 1)}"
                        th:if="${page >= cases.number - 2 and page <= cases.number + 2}"
                        th:classappend="${page == cases.number} ? 'active'">
                        <a class="page-link" th:text="${page + 1}" th:href="@{/cases/finance(page=${page})}">1</a>
                    </li>

                    <li class="page-item" th:classappend="${cases.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/cases/finance(page=${cases.number + 1})}" aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div id="writeModal" class="modal-overlay" onclick="closeModal(event, 'writeModal')">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">금융기관 사칭 사례 등록</span>
                <button class="close-btn" onclick="closeModalForce('writeModal')">×</button>
            </div>
            <div class="form-section">
                <form name="reportForm" th:action="@{/cases/save}" method="post" onsubmit="return validateForm()">
                    
                    <input type="hidden" name="typeId" value="4"> 

                    <div class="form-group mb-3">
                        <label class="form-label">사칭 은행 선택</label>
                        <select name="agencyId" class="form-select">
                            <option value="bank_kb">KB국민은행</option>
                            <option value="bank_shinhan">신한은행</option>
                            <option value="bank_woori">우리은행</option>
                            <option value="bank_hana">하나은행</option>
                            <option value="bank_nh">NH농협은행</option>
                            <option value="bank_kakao">카카오뱅크</option>
                            <option value="bank_toss">토스뱅크</option>
                            <option value="fss">금융감독원</option>
                            <option value="card_company">카드/캐피탈</option>
                            <option value="etc">기타</option>
                        </select>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">제목 (핵심 키워드)</label>
                        <input type="text" name="title" class="form-input" placeholder="예: 저금리 대환대출 문자 수신">
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">내용 (문자 내용, 전화번호 등)</label>
                        <textarea name="content" class="form-textarea" placeholder="수신된 문자 내용이나 통화 정황을 입력하세요."></textarea>
                    </div>
                    
                    <div class="form-group mb-3">
                        <label class="form-label">비밀번호 (수정/삭제용)</label>
                        <input type="password" name="guestPw" class="form-input" placeholder="비밀번호 4자리 이상">
                    </div>

                    <button type="submit" class="submit-btn">등록하기</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openWriteModal() {
            const form = document.forms['reportForm'];
            if(form) form.reset();
            document.getElementById('writeModal').classList.add('active');
        }
        function closeModal(event, modalId) {
            if (event.target === document.getElementById(modalId)) {
                document.getElementById(modalId).classList.remove('active');
            }
        }
        function closeModalForce(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // [폼 유효성 검사 및 필수 필드 체크]
        function validateForm() {
            const form = document.forms['reportForm'];
            
            // DTO 필드명과 일치하는 name 속성 사용
            const title = form['title'].value.trim();
            const content = form['content'].value.trim(); 
            const guestPw = form['guestPw'].value.trim();

            if (title === "") {
                alert("⚠️ 제목을 입력해주세요.");
                form['title'].focus();
                return false;
            }

            if (content === "") {
                alert("⚠️ 상세 내용을 입력해주세요.");
                form['content'].focus();
                return false;
            }

            if (guestPw === "") {
                alert("⚠️ 비밀번호를 입력해주세요.");
                form['guestPw'].focus();
                return false;
            }

            if (!confirm("🚨 신고 내용을 등록하시겠습니까?\n(허위 사실 기재 시 불이익을 받을 수 있습니다.)")) {
                return false;
            }

            return true;
        }

        // [수정 요청 함수]
        function requestEdit(id) {
            const pw = prompt("🔒 수정하려면 비밀번호를 입력하세요:");
            
            if (pw) {
                location.href = '/cases/' + id + '/edit?pw=' + encodeURIComponent(pw);
            }
        }

        // [삭제 요청 함수]
        function requestDelete(id) {
            const pw = prompt("🗑️ 삭제하려면 비밀번호를 입력하세요:");
            
            if (!pw || pw.trim() === "") {
                alert("비밀번호가 입력되지 않았습니다. 취소합니다.");
                return;
            }
            
            if (confirm("WARNING: 정말로 영구 삭제하시겠습니까?")) {
                location.href = '/cases/' + id + '/delete?pw=' + encodeURIComponent(pw.trim());
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>새 사례 등록 - 보안 경보</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* [기본 폰트 및 배경 설정] */
        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #131224 0%, #1d1b38 100%);
            color: #ffffff;
            font-family: 'Pretendard', 'Segoe UI', sans-serif; /* 폰트 변경 권장 */
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        /* [컨테이너 - 유리 질감 효과] */
        .container {
            width: 100%; max-width: 600px; padding: 40px;
            background: rgba(30, 30, 50, 0.5); 
            backdrop-filter: blur(15px); /* 유리처럼 흐리게 */
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* [타이틀] */
        h2 {
            text-align: center; font-size: 26px; margin-bottom: 30px;
            font-weight: 700; letter-spacing: 1px;
            background: linear-gradient(to right, #d68dfc, #a74cf2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(167, 76, 242, 0.3);
        }

        /* [폼 요소 공통] */
        .form-group { margin-bottom: 24px; }
        
        label {
            display: block; margin-bottom: 10px; margin-left: 4px;
            font-size: 14px; color: #a8a8b3; font-weight: 500;
        }

        input, textarea, select {
            width: 100%; padding: 16px;
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #eee; font-size: 15px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            appearance: none;
        }

        /* 포커스 시 네온 효과 */
        input:focus, textarea:focus, select:focus {
            outline: none; 
            border-color: #a74cf2;
            box-shadow: 0 0 0 4px rgba(167, 76, 242, 0.1);
            background: rgba(25, 25, 40, 0.8);
        }

        textarea { resize: vertical; min-height: 140px; line-height: 1.6; }

        /* [하단 경고 박스] */
        .warning-box {
            background: rgba(255, 71, 87, 0.08);
            border: 1px solid rgba(255, 71, 87, 0.2);
            color: #ff6b81;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .warning-box strong { color: #ff4757; }

        /* [버튼 그룹] */
        .btn-group { display: flex; gap: 12px; margin-top: 10px; }

        button {
            flex: 1; padding: 18px; border: none; border-radius: 14px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }

        /* 등록 버튼 (그라데이션) */
        .btn-submit {
            background: linear-gradient(135deg, #ce66ff 0%, #9b3dfc 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(155, 61, 252, 0.3);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(155, 61, 252, 0.4); }

        /* 취소 버튼 */
        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.1); color: white; }

        .back-link {
            display: inline-flex; align-items: center;
            padding: 8px 16px; margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #a8a8b3; text-decoration: none; font-size: 13px;
            transition: 0.3s;
        }
        .back-link:hover { background: rgba(255, 255, 255, 0.05); color: #fff; border-color: rgba(255,255,255,0.3); }


        /* -------------------------------------------
           [SweetAlert2 커스텀 디자인 - 4.14.11.jpg 스타일] 
           ------------------------------------------- */
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: #1e1b2e !important; /* 아주 어두운 보라색 배경 */
            border: 1px solid rgba(167, 76, 242, 0.3) !important; /* 은은한 보라색 테두리 */
            border-radius: 20px !important;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6) !important;
            padding: 30px !important;
            width: 400px !important;
        }

        /* 아이콘 스타일 수정 */
        div:where(.swal2-icon).swal2-warning {
            border-color: #fca5a5 !important; /* 연한 붉은색 테두리 */
            color: #f87171 !important; /* 아이콘 색상 */
        }

        /* 제목 스타일 */
        div:where(.swal2-container) .swal2-title {
            color: #ffffff !important;
            font-size: 22px !important;
            margin-top: 20px !important;
            font-weight: 700 !important;
        }

        /* 본문 텍스트 스타일 */
        div:where(.swal2-container) .swal2-html-container {
            color: #d1d1e0 !important;
            font-size: 15px !important;
            line-height: 1.6 !important;
            margin-top: 15px !important;
        }

        /* 액션 버튼 컨테이너 */
        div:where(.swal2-container) .swal2-actions {
            margin-top: 30px !important;
            gap: 10px !important;
        }

        /* '네, 등록합니다' 버튼 */
        div:where(.swal2-container) .swal2-confirm {
            background: linear-gradient(135deg, #e384ff, #a95df2) !important;
            box-shadow: 0 0 15px rgba(169, 93, 242, 0.5) !important; /* 네온 글로우 */
            border-radius: 50px !important; /* 둥근 알약 모양 */
            padding: 12px 30px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
        }

        /* '취소' 버튼 */
        div:where(.swal2-container) .swal2-cancel {
            background: #3e3b52 !important; /* 짙은 회색 배경 */
            color: #ccc !important;
            border-radius: 50px !important;
            padding: 12px 24px !important;
            font-size: 15px !important;
        }
        
        div:where(.swal2-container) .swal2-cancel:hover {
            background: #4a4763 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

<div class="container">
    
    <a href="javascript:history.back()" class="back-link">← 돌아가기</a>

    <h2>새 사례 등록</h2>

    <form name="addForm" th:action="@{/cases/save}" method="post" onsubmit="return validateForm(event)">
        
        <input type="hidden" name="typeId" th:value="${targetType}">

        <div class="form-group" th:unless="${targetType == 1}">
            <label for="agencyId">사칭 유형 / 기관</label>
            <select id="agencyId" name="agencyId">
                <th:block th:if="${targetType == 2}">
                    <option value="prosecutor">검찰청 (서울지검 등)</option>
                    <option value="police">경찰청</option>
                    <option value="fss">금융감독원</option>
                    <option value="bluehouse">청와대/정부부처</option>
                    <option value="etc">기타 공공기관</option>
                </th:block>

                <th:block th:if="${targetType == 3}">
                    <option value="tele_invest">주식/코인 리딩방</option>
                    <option value="tele_romance">로맨스 스캠</option>
                    <option value="tele_job">쇼핑몰 리뷰 알바</option>
                    <option value="tele_deepfake">딥페이크 협박</option>
                    <option value="etc">기타 사이버 사기</option>
                </th:block>

                <th:block th:if="${targetType == 4}">
                    <option value="bank_kb">KB국민은행</option>
                    <option value="bank_shinhan">신한은행</option>
                    <option value="bank_woori">우리은행</option>
                    <option value="bank_hana">하나은행</option>
                    <option value="bank_kakao">카카오뱅크/토스</option>
                    <option value="card_company">카드사/캐피탈</option>
                    <option value="etc">기타 금융기관</option>
                </th:block>
            </select>
        </div>

        <input type="hidden" name="agencyId" value="job_scam" th:if="${targetType == 1}">

        <div class="form-group">
            <label for="title">사례 제목</label>
            <input type="text" id="title" name="title" placeholder="피해 사례 제목을 입력하세요 (예: 재택 알바 모집)">
        </div>

        <div class="form-group">
            <label for="content">사례 내용</label>
            <textarea id="content" name="content" placeholder="범인의 연락처, 계좌번호, 대화 내용 등 상세 정보를 입력하세요."></textarea>
        </div>

        <div class="form-group">
            <label for="guestPw">비밀번호</label>
            <input type="password" id="guestPw" name="guestPw" placeholder="수정/삭제용 비밀번호 (숫자 4자리 권장)">
        </div>

        <div class="warning-box">
            ⚠️ 주제와 관련 없는 글이나 장난성 글은 <br>
            <strong>예고 없이 삭제</strong>될 수 있습니다.
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-submit">등록하기</button>
            <button type="button" class="btn-cancel" onclick="history.back()">취소하기</button>
        </div>

    </form>
</div>

<script>
    function validateForm(e) {
        e.preventDefault(); // 폼 바로 전송 막기

        const form = document.forms['addForm'];
        const title = form['title'].value.trim();
        const content = form['content'].value.trim();
        const guestPw = form['guestPw'].value.trim();

        // 간단 유효성 검사
        if (title === "") {
            Swal.fire({ icon: 'warning', title: '입력 오류', text: '제목을 입력해주세요.', confirmButtonColor: '#a74cf2' });
            return false;
        }
        if (content === "") {
            Swal.fire({ icon: 'warning', title: '입력 오류', text: '상세 내용을 입력해주세요.', confirmButtonColor: '#a74cf2' });
            return false;
        }
        if (guestPw === "") {
            Swal.fire({ icon: 'warning', title: '입력 오류', text: '비밀번호를 입력해주세요.', confirmButtonColor: '#a74cf2' });
            return false;
        }

        // [SweetAlert2 팝업 설정]
        Swal.fire({
            title: '등록 하시겠습니까?',
            // html 속성 사용 (줄바꿈 및 색상 강조)
            html: `허위 사실 유포 시 법적 책임을 질 수 있으며,<br>
                   <span style="color: #ff6b81; font-weight: 700; margin-top: 5px; display: inline-block;">
                       연관 없는 글은 즉시 삭제됩니다.
                   </span>`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '등록', // 버튼 텍스트 줄바꿈용
            cancelButtonText: '취소',
            // 스타일은 위 CSS(.swal2-confirm 등)에서 제어됨
            buttonsStyling: true, 
            reverseButtons: true // 버튼 순서 변경 (취소 왼쪽, 확인 오른쪽)
        }).then((result) => {
            if (result.isConfirmed) {
                form.submit(); // 확인 클릭 시 전송
            }
        });
    }
</script>

</body>
</html>

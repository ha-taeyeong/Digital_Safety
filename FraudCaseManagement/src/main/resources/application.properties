spring.application.name=FraudCaseManagement

# 필수 데이터소스 설정
spring.datasource.url=jdbc:mysql://localhost:3306/digital_safety?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1378
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Hibernate Dialect 명시 (옵션이지만 오류 회피를 위해 추가 권장)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## DDL 설정 (테이블 변경 금지)
spring.jpa.hibernate.ddl-auto=none 

## 1. 생성된 SQL을 콘솔에 보여줌
spring.jpa.show-sql=true

## 2. SQL을 예쁘게 줄바꿈해서 보여줌 (가독성 UP)
spring.jpa.properties.hibernate.format_sql=true

## 3. ★ 핵심 ★ 물음표(?)에 들어가는 실제 값을 보여줌
logging.level.org.hibernate.orm.jdbc.bind=trace